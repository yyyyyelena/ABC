  <div class="menu-bar">
    <!-- <div class="project-title">✨ Memory Map 🗺️</div> -->
    <div class="menu-selection">
      <div class="menu-section-title">select city</div>
      <button onclick="changeCity('BA')">⚽️ Buenos Aires 🇦🇷</button>
      <button onclick="changeCity('SH')">🌃 Shanghai 🏮</button>
      <button onclick="changeCity('NY')">🗽 New York 🥯</button>
    </div>

    <!-- for displaying user location -->
    <div class="menu-selection">

    <div id="memory-popup" class="popup-hidden">
      <button class="popup-close-btn" onclick="closePopup()">X</button>

      <h2 id="popup-title">Title</h2>
      <p id="popup-text">Description...</p>
      <div id="popup-content-area" class="popup-media"><img src="" id="popupImg" alt=""></div>

      <button id="delete-memory" class="popup-media"> delete note </button>
      <button id="edit-memory" class="popup-media"> edit note </button>

    </div>


    <!-- creatw new memory -->
    <div id="new-memory-popup" class="popup-hidden">
      <button class="popup-close-btn" onclick="closeNewMemoryPopup()">X</button>
      <h2>📍 Add New Memory</h2>
      <div class="note-section">
        <strong>Title:</strong>
        <input type="text" id="new-memory-title" class="note-area" placeholder="Give your memory a title..."
          maxlength="40">
        <strong>Your Note:</strong>
        <textarea id="new-memory-text" class="note-area" rows="4"
          placeholder="Type your persistent memory here..."></textarea>
        <strong>Your Image:</strong>
        <input type="file" id="memory-file-input" accept="image/*">
        <!-- <button id="choose-emoji-btn">Choose Emoji</button>
          <span id="chosen-emoji-preview" style="font-size: 24px;"></span> -->
      </div>
      <button class="save-btn" onclick="saveNewMemory()">Create & Share</button>
    </div>
